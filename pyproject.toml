[project]
name = "example-server"
version = "0.1.0"
description = "Starter MCP server for the GSA MCP hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "matplotlib>=3.11.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "seaborn>=0.13.2",
]

[project.scripts]
# Lets you run the server with `uv run example-server`.
example-server = "example_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_server"]

[dependency-groups]
# Dev deps. Install with `uv sync --group dev`.
# `requests` is here so the tools/gsa_jdp_mcp_toolkit stdio servers can run in
# this venv (the eval harness launches them with this venv's python).
# The Phoenix eval harness itself is a SEPARATE uv project (eval/phoenix/) —
# its langchain-mcp-adapters needs mcp<2 while the toolkit needs mcp>=2.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "requests>=2.31.0",
    # Makes requests/pip trust the OS certificate store — required on machines
    # behind corporate TLS interception (otherwise the toolkit servers' HTTPS
    # calls fail certificate verification); harmless elsewhere.
    "pip-system-certs>=4.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
# Don't reformat Python code fences inside Markdown docs (they're illustrative
# snippets, not runnable modules).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
