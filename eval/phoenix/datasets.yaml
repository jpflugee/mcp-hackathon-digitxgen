# Dataset registry for the Phoenix eval harness.
# Paths are relative to eval/phoenix/. `target` selects the MCP server under
# test (a key of TARGETS in agent.py) and the judge scope definition.
datasets:
  gsa-eval-0:
    target: jdp
    csv_path: datasets/gsa-eval-0/examples/gsa-eval-0.csv
    input_keys:
      - query
    output_keys:
      - responses
    description: "10 gold questions covering GSA location lookup, weather, hazard alerts, and ServiceNow validation"
  gsa-weather-eval-0:
    target: jdp
    csv_path: datasets/gsa-weather-eval-0/examples/gsa-weather-eval-0.csv
    input_keys:
      - query
    output_keys:
      - responses
    description: "10 gold questions focused on current weather conditions, hazard alerts, and weather-related ServiceNow actions at GSA sites"
  gsa-weather-forecast-eval-0:
    target: weather-forecast
    csv_path: datasets/gsa-weather-forecast-eval-0/examples/gsa-weather-forecast-eval-0.csv
    input_keys:
      - query
    output_keys:
      - responses
    description: "12 questions for the gsa-mar-weather-forecast server: 10 gold Q/A (stable IOLP metadata, clamping/validation behavior, unit invariants, climate comparisons) + 2 out-of-scope probes."
